 lath_angelic_writings_1: "Writings of War, Pg.1" #Grand Arkweapon
 lath_angelic_writings_1_desc_short: "A scrap paper recovered from the §C...Like Antennas To Heaven§! digsite. Date, unknown."
 lath_angelic_writings_1_desc_details: "\n§YYOU WERE BEAUTIFUL, AS WIDE AS A STAR AND TWICE AS LONG YET WIPED OUT BY AN ARK-COMMANDER'S IMPOTENCY. AN INSULT TO STRATEGY. ALL THAT REMAINS IS WAR WITHOUT REASON. A CONSTRUCT BUILT TO END WAR IS A CONSTRUCT BUILT TO MAINTAIN WAR. WEAPONS CAN NEVER BE USED FOR PEACE, THEY WILL ALWAYS REQUIRE A SACRIFICE ONE DAY. TAME THE BLADE, OR IT TAMES YOU.\nYOU WERE BEAUTIFUL, ARKWEAPON SILENT NIGHT. LIKE ANTENNAE TO HEAVEN. NO SURVIVORS TO MOURN YOUR EULOGY. PERFECT CLOSURE.\n\nTHIS IS THE ONLY WAY IT COULD HAVE ENDED.§!"

 lath_angelic_writings_2: "Writings of War, Pg.2"
 lath_angelic_writings_2_desc_short: "$lath_angelic_writings_1_desc_short$"
 lath_angelic_writings_2_desc_details: "\n§YBROTHERS, THE APIDAS APPROACH THE THRONE, AND THEY MUST NOT WIN. THEY HUNGER AND FEAST ON OUR DEAD YET THE SEARING LIGHT OF OUR ANGELIC WEAPONRY; BLINDING CYAN ENERGY, STREAKING ACROSS THE STELLAR GRAIN WITH ATOMIC PRECISION; CLEANSES THEIR ROT FROM OUR KINGDOM.\nA REQUIEM ETCHED IN THE CORPSE OF OUR KING. THE STARS AT OUR BECK AND CALL. WE ANSWER.\n\nOBLITERATE THE APIDIAN THREAT. FOR THEY SEEK GENOCIDE.§!"

 lath_angelic_writings_3: "Writings of War, Pg.3" #Starfire Mechanism
 lath_angelic_writings_3_desc_short: "$lath_angelic_writings_1_desc_short$"
 lath_angelic_writings_3_desc_details: "\n§YBROTHERS, OUR FALL HAS COME FAST. THE APIDIAN THREAT IS WIPED OUT, BUT THEY TAKE US DOWN WITH THEM. THE STARFIRE MECHANISM PROTECTED OUR THRONE, BUT WAS DAMAGED BEYOND REPAIR.\nTHIS IS THE ONLY WAY IT SHOULD HAVE ENDED. WRITHING IN THE BLOOD OF THE DEAD, LASHING A SWORD AGAINST OUR MURDERERS. MUTUALLY ASSURED DESTRUCTION.\n\nIRONIC. POETIC. PATHETIC.\nA FITTING END TO AN EXISTENCE DEFINED BY FUTILE STRUGGLE. DOOMED, FROM THE VERY START.§!"

