 im_infinitymatter: "Universal Matter"
 im_infinitymatter_desc: "Brilliant, impervious, and heavy. Useful for ships, buildings, and megastructures."
 im_infinityenergy: "Celestial Energy"
 im_infinityenergy_desc: "Blinding, searing, and tensile. Useful for weapons, components, and energy-based equipment."
 im_infinitypoints: "Infinity Points"
 im_infinitypoints_desc: "The conglomeration of our efforts approaching the point of Infinity. \n\n§CHow to get Infinity Points§!\n-----\n1. §YIdling with an Infinity Transmutator§! \n2. §YTerminate hostile ships§! \n3. §YHolding special megastructures§!"
 
 ap_im_infinityempire: "§YInfinity§! §CEmpire§!"
 ap_im_infinityempire_desc: "Playing it safe is not enough. If we want to ascend to technological singularity, we need to work for it - the mastery of mind, body, and technology will unify into the collective focus of becoming Infinite."
 
 im_angel_crisis_begin: "Ascension To The Throne"
 im_angel_crisis_begin_desc: "As the galaxy gets more and more dangerous for us, we need to seek higher and higher levels of safety. With the high likelihood of threat caused by the Fallen Empires, we cannot underestimate how ready we have to be for total war. \n\n§YOur future is at stake. We must make this necessary step, Galaxy be damned.§!"
 im_angel_crisis_begin_desc_relig: "Our belief unto the Shroud is at stake by the infidels around us, allies or not. If we want to secure our existence, we need to get as high as possible. As such, with the threat posed by the arrogant Fallens, we must ready ourselves through ascension. \n\n§YOur home and morality is at stake. Galaxy be damned, we will survive.§!"
 im_angel_crisis_begin_desc_mach: "Our Processor has calculated that the highest likelihood of safety is in the divine. As such, it is not illogical - not anymore - to place our bets into technologies regarding the Shroud. \n\n§YWe will ascend. We will not be matched.§!"
 im_angel_crisis_begin_desc_hive: "The Overmind has found a new territory for us. Our Collective shall secure our future within divinity. One way or another, our Collective shall become the apex of this galaxy. \n\n§YAll nodes are ready. Galaxy be damned, we are ready.§!"
 IM_CRISIS_START_NORM: "Let it be done."
 IM_CRISIS_START_PSI: "The Shroud wills it."
 
 im_crisobj_addpts_name: "Develop/Gain Points"
 im_crisobj_addpts_desc: "Infinity Points are created by merging CE and UM at a Transmutator. These can also be given by events."
 im_crisobj_holdstructs_name: "Strategic Grip"
 im_crisobj_holdstructs_desc: "Hold onto strategic megastructures (Forge of Ares, Bow of Athena, etc)."
 
