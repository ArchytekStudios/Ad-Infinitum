 im_infinitypoints_crisis_description_title: "Generation of Points"
 im_infinitypoints_crisis_description: "There are (currently) three ways to generate §CInfinity Points§!\n\n1. §YUsing a Transmutator, or relevant megastructures.§! Transmutators are good sources of £infinitypoints£§CPoints§!, but are often paired with megastructures. §RProtect them at all costs, as they are priority assets.§! \n\n2. §YCombat Experience.§! Every ship kill lends you a favor from the Shroud, gifting you a §Ccouple £infinitypoints£Points§! per ship. \n\n3. §YStrategic Grip.§! Maintaining a hold on a strategic megastructure will net you §C£infinitypoints£150 Points§! monthly."
 im_infinitypoints_crisis_howto_title: "Approaching Divinity"
 im_infinitypoints_crisis_howto: "The Spiritualists of this galaxy know not of divinity; their Shroud imitation mimicks Her Beauty to an insulting degree. As such, we have chosen the route of divinity and ascension, to prove ourselves as the rightful masters of this universe."
 
 ### Perks
 menp_angelduties_l1: "Angelic Duties - L1"
 menp_angelduties_l1_desc: "Guards to Our Throne must be recruited; and as such, shall be named in honor of the Holy Guardians, §COphanim,§! and its' corresponding §CSoul Core§!."
 menp_honorguard_l1: "Honor Guard - L1"
 menp_honorguard_l1_desc: "To begin our journey, the preliminary equipment necessary for ascension shall be researched first and foremost. From Point Defenses, to Medium components, including core components."
 menp_divinestructures: "Divine Structures"
 menp_divinestructures_desc: "In order to supplant our legacy within galactic history, we must acquire buildings fit for Gods; first and foremost, we shall acquire Fallen Empire templates, and build upon them in the name of perfection."
 menp_structural_mastery: "§YStructural Mastery§!"
 menp_structural_mastery_desc: "If we want to ascend further, we must §Cmaster the Material art.§!"
 menp_angelduties_l2: "Angelic Duties - L2"
 menp_angelduties_l2_desc: "To prove our ascension, we must construct wonders of technology, blending machine and divinity into one."
 menp_shrouds_will_be_done: "Shroud's Will Be Done"
 menp_shrouds_will_be_done_desc: "Existential threats must receive the full force of our army and navy; as such, Shroud shall grant us strength to fight them head-on."
 menp_honorguard_l2: "Honor Guard - L2"
 menp_honorguard_l2_desc: "Our normal ships shall not suffer from lack of maintenance. If we want to continue parity, we must begin using Infinity weapons - or angelic weapons repurposed for non-angelic ships."
 menp_biological_mastery: "§YBiological Mastery§!"
 menp_biological_mastery_desc: "If we want to ascend further, we must §Cmaster the Organic art.§!"
 menp_angelduties_l3: "Angelic Duties - L3"
 menp_angelduties_l3_desc: "Generals and Commanders of fleets, §CCherubim§! are the purveyors of our Word, and thus are our Strong Right Hand."
 menp_honorguard_l3: "Honor Guard - L3"
 menp_honorguard_l3_desc: "We must break deeper and deeper into Eschatological weaponry; specifically, the use of thaumaturgics in flight-capable vessels. As such, strike crafts and guided missiles - as well as heavier laser platforms - shall be researched."
 menp_forgeofares: "§YForge of Ares§!"
 menp_forgeofares_desc: "Our alloy production will suffer if we do not step up the production of such. As thus, the §CForge of Ares§! shall be made in order to bolster our alloys, energy, and fleet production."
 menp_psionic_mastery: "§YPsionic Mastery§!"
 menp_psionic_mastery_desc: "If we want to ascend further, we must §Cmaster the Art of The Mind.§!"
 menp_honorguard_l4: "Honor Guard - L4"
 menp_honorguard_l4_desc: "To acquire better weapons for our ships, in the age of divinity, we must reach deeper and deeper into the exploitation of Celestial Energy for higher-powered weapons."
 menp_angelduties_l4: "Angelic Duties - L4"
 menp_angelduties_l4_desc: "Standard infrastructure won't do. For our specialized buildings, made almost purely of UM and CE, we need a §CGaia Hearthworld§!; around a singularity churns the §CForge of Thanatos§!, the black hole variant of the earlier Forge of Ares; and thus, the §CEye of The Shroud§!, our all-seeing eye, blocking jumps into the system."
 menp_predivinity: "§CPre-Divinity§!"
 menp_predivinity_desc: "We must dip our digits into the pond of the Shroud if we wish to continue."
 menp_honorguard_l5: "§CGuard of the Shroud§!"
 menp_honorguard_l5_desc: "To properly defend our position, even the planets which the Undivine dwell upon must be wiped out if they pose such a threat."
 menp_the_seraph: "§CThe Seraph§!"
 menp_the_seraph_desc: "Our Messengers, Our Will, the §CSeraphim§! are the embodiment of Our Message. Every battle they enter, every fight they win or lose, is a testament to our survival."
 menp_seat_of_divinity: "§CSeat of Divinity§!"
 menp_seat_of_divinity_desc: "To put it short, we need a new home - around a §CSearing Star§! will work best. If one doesn't exist, §Rwe will make it ourselves.§!"
 
 ### Projects
 IM_INFINITYCRISIS_STRUCTMAST: "Structural Mastery"
 IM_INFINITYCRISIS_BIOMAST: "Biological Mastery"
 IM_INFINITYCRISIS_PSIMAST: "Psionic Mastery"
 IM_INFINITYCRISIS_PREDIV: "§CPre-Divinity§!"
 
 IM_INFINITYCRISIS_STRUCTMAST_DESC: "To master the art of the materiel, one must become accustomed with §YMegastructures§! and other intensive structures. As such, in order to prove our strategic intelligence, we must master the art of construction by pooling our resources to finalizing our intelligence in this department."
 IM_INFINITYCRISIS_BIOMAST_DESC: "Our next step sees us mastering the art of genetic manipulation and creation. If we want to continue ascension, we must ensure our complete dominion by engineering microbes and macrobes alike to act in our favor."
 IM_INFINITYCRISIS_PSIMAST_DESC: "The last step of mastery sees us finalizing our Psionic approach. In order to encompass all possible routes, we must study the mind and its' connection to the Shroud, opening as many routes as possible."
 IM_INFINITYCRISIS_PREDIV_DESC: "The dawn of divinity is upon us. If we want to finally ascend, we must take the last necessary step and secure a proper spot for our throne. To legitimize our power, if we haven't already, we must utilize our force and wit as much as necessary, to ensure our place in galactic history is cemented. §RThere is no turning back.§!"
 
 ### Planets/Stars
 pc_im_searing_star: "§CSearing Star§!"
 sc_im_searing_star: "$pc_im_searing_star$"
 pc_im_searing_star_desc: "A star of §Cunbelievable temperature§!, reaching §Ca couple billion Kelvin§!, only suited for §Cthe most divine of megastructures.§!"
 
 pc_im_bleeding_world: "§CBleeding World§!"
 pc_im_bleeding_world_desc: "Baked in the light of a $pc_im_searing_star$, this world has effectively become obliterated, barely holding together under the immense heat and radiation of its' parent star. However, with the right technology, it can be transformed into a thriving ecumenopolis that harvests this power."
 pc_im_bleeding_ecu: "§CHestian Cityworld§!"
 pc_im_bleeding_ecu_desc: "A dead world given life, the Hestian Cityworld is a planet-scale ecumenopolis harvesting the violent heat of the star above the sky. Powered both by the heat of the star, of itself, and by the resilience of the people, this structure is enough to be the capitol of an empire."