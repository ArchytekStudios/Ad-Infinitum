    tech_honorguard_l2: "Honor Guard - L2"
    tech_honorguard_l2_desc: "$menp_honorguard_l2_desc$"

    tech_honorguard_l3: "Honor Guard - L3"
    tech_honorguard_l3_desc: "$menp_honorguard_l3_desc$"
    tech_honorguard_l3_2: "Augments - Searing Laser"
    tech_honorguard_l3_2_desc: "§CLarger and larger emplacements must be affixed to our ships.§!"
    tech_honorguard_l3_3: "$IM_ANGEL_BOMBARDMENT$"
    tech_honorguard_l3_3_desc: "§CThe thrill of the hunt races through every being. Let us embrace it.§!"
    tech_honorguard_l3_4: "Heir & Assassin Hanger Units"
    tech_honorguard_l3_4_desc: "§CMust we restrict ourselves? Pathetic primitives, we shall extend our air support to space!§!"
    tech_aresforge: "$im_aresforge_base$"
    tech_aresforge_desc: "$im_aresforge_base_DESC$"

    tech_star_searing: "Star Searing"
    tech_star_searing_desc: "Our megastructures are inefficient when around even the hottest O-class stars. As such, §Cwe must Sear the stars, bringing them to unfathomable heat.§! The added heat may sterilize some systems, though, but the economic benefit is well worth the risk."
    tech_searing_stabilize: "Planetscale Searing Protection Systems"
    tech_searing_stabilize_desc: "In the wake of obliterating entire systems for our divinity, creating $sc_im_searing_star$s causing brilliant $pc_im_bleeding_world$s to form, there are suitable uses for these anomalies than leaving them as junk. Why not cool them down and ecumenopolize them?"
    ADINF_STABILIZE_BLEEDING_WORLD: "§HUnlocks Feature:§! Stabilize $pc_im_bleeding_world$s"
    ADINF_STABILIZE_BLEEDING_WORLD_DESC: "With the presence of one or more $pc_im_bleeding_world$s, we are certain we can make some use of them. Instead of leaving them as wreckage, and §Yif we have Dominion technology§!, we can turn one into a $pc_im_bleeding_ecu$."

    tech_im_planetkillers: "Strategic Angelic Weapons"
    tech_im_planetkillers_desc: "These weapons aboard our ships will do well to project our power across the void utterly."

    tech_honorguard_l4: "Honor Guard - L4"
    tech_honorguard_l4_desc: "$menp_honorguard_l4_desc$"
