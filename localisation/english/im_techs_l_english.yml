l_english:

    tech_im_armorhard: "Singular Armor Hardener"
    tech_im_armorhard_desc: "A dedicated armor hardener for our ships, using Universal materiel. Increases hardening and damage resistance."
    tech_im_shieldhard: "Singular Shield Hardener"
    tech_im_shieldhard_desc: "A dedicated shield hardener for our ships, using Universal materiel. Increases hardening and energy weapon accuracy."
    tech_im_engineamp: "Singular Engine Amplifier"
    tech_im_engineamp_desc: "A dedicated engine booster for our ships, using Universal materiel. Increases speed, jump range, and reduces cooldown."
    tech_im_wepenh: "Singular Energy Multiplex"
    tech_im_wepenh_desc: "A dedicated weapon enhancement platform for our ships, using Universal materiel. Increases damage output."

    tech_honorguard_l1: "Honor Guard - L1"
    tech_honorguard_l1_desc: "$menp_honorguard_l1_desc$"
    tech_honorguard_l1_2: "Palladin Armor"
    tech_honorguard_l1_2_desc: "Using Universal Matter, we can reinforce the hulls of our vessels, making them far stronger than anything else."
    tech_honorguard_l1_3: "Palladin Shield"
    tech_honorguard_l1_3_desc: "Using Celestial Energy, we can further protect our vessels' armor and hulls, projecting a defensive searing barrier that can catch most of everything."
    tech_honorguard_l1_4: "Singular Propulsion Systems"
    tech_honorguard_l1_4_desc: "Using Celestial Energy, we can exploint singularity-based reactions to propel our ships beyond the Speed of Light."
    tech_honorguard_l1_5: "Singular Intelligence Systems"
    tech_honorguard_l1_5_desc: "The intelligence systems running our ships must be upgraded to better support our Celestial resources."
    tech_ophanim_ship: "Angelic Duties - L1"
    tech_ophanim_ship_desc: "$menp_angelduties_l1_desc$"
    tech_cherubim_ship: "Angelic Duties - L3"
    tech_cherubim_ship_desc: "$menp_angelduties_l3_desc$"
    tech_seraphim_ship: "$menp_the_seraph$"
    tech_seraphim_ship_desc: "$menp_the_seraph_desc$"

    tech_hermes_gateway: "Angelic Duties - L2"
