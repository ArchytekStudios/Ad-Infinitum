l_english:

 decision_im_spawn_capitol: "Establish §CDominion§!"
 decision_im_spawn_capitol_desc: "Whatever capital we have on this planet isn't powerful enough."
 IM_SPAWN_CAPITOL_EFFECT: "Removes current capitol building and swaps it out for the $building_im_capitol$."
 
 ### Buildings T1
 building_im_infinityengine: "Infinity Engine"
 building_im_infinityengine_desc: "A stepping stone into the future. By conglomerating the folds of the universe, as well as adding alloys and Dark Matter, we're able to get our hands on some nifty Universal Matter."
 building_im_infinitysingularity: "Infinity Singularity"
 building_im_infinitysingularity_desc: "The power scaling feels illegal. By pulling in the idle background radiation of the universe, on top of energy and Dark Matter, we're able to reform it into Celestial Energy."
 building_im_infinitypoints: "Infinity Transmutator"
 building_im_infinitypoints_desc: "This structure combines Universal Matter and Celestial Energy into a resource we can use to further our reach; specifically, §CPoints§!. While presently inefficient, this can be upgraded later."
 
 ### Buildings T2
 building_im_capitol: "§CDominion§!"
 building_im_capitol_desc: "§COur power requires the seats to hold it.§!"
 building_im_labs: "§CStudy Hall§!"
 building_im_labs_desc: "§COur intelligence must be fostered.§!"
 building_im_fabricator: "§CMonolith§!"
 building_im_fabricator_desc: "§CGrowth requires worship of the Monolith, the Everhungry, in order to ensure our growth.§!"
 
 ### T3
 building_im_manipulator: "§CManipulator§!"
 building_im_manipulator_desc: "§COur continued existence, from this point on, heavily relies on the production of Celestial Energy and Universal Matter. Supplementing the Monolith with the Manipulator will secure our future, for now.§!"
 building_im_shield: "§CPaladin§!"
 building_im_shield_desc: "§CProtection of our People and our Will requires our strongest shields.§!"
 building_im_tetraforge: "§CTetraforge§!"
 building_im_tetraforge_desc: "§CWe must create. We must forge. Alloys unlike any other must be created.§!"
 building_im_energyplant: "§CSolus§!"
 building_im_energyplant_desc: "§CThe Sun, In A Bottle.§!"
 building_im_supercity: "§CRegion§!"
 building_im_supercity_desc: "§CA metropolis fit for kings and queens, which could house entire polities.§!"
 building_im_points2: "§CAdept Transmutator§!"
 building_im_points2_desc: "§CCreation of points must meet our full attention, otherwise we will not continue to grow.§!"
 building_im_security:0 "§CSentry Station§!"
 building_im_security_desc:0 "§CPower projection is important, but the security of home is even moreso.§!"
 building_im_assembly:0 "§CMachination Complex§!"
 building_im_assembly_desc:0 "§CMachines of divine design can be created here; from mechanisms imperceptible to the normal eye, to gears and cogs representing our divinity.§!"
 building_im_entertainment:0 "§CSuprahall§!"
 building_im_entertainment_desc:0 "§CLike water, amenities flow like the water of the universe.§!"
 building_im_clinic:0 "§CHealth Ward§!"
 building_im_clinic_desc:0 "§COur people will still require upkeep and healthcare, as well as Outsiders who may visit us.§!"
 building_im_tradehall:0 "§CCommercial Hub§!"
 building_im_tradehall_desc:0 "REPLACE_ME"

