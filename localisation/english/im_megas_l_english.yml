l_english:

 im_hermes_gateway: "§CHermes§! Gateway"
 im_hermes_gateway_DESC: "Our reach must become infinite. If we're to confirm our hold on this galaxy, §Ywe must ensure our reach is all-encompassing.§!"
 im_hermes_gateway_MEGASTRUCTURE_DETAILS: "$im_hermes_gateway_DESC$"

 im_athena_bow: "§CBow of Athena§!"
 im_athena_bow_DESC: "If we want to ensure superiority, §Ywe must secure our strength.§!"
 im_athena_bow_MEGASTRUCTURE_DETAILS: "§YSTRATEGIC MEGASTRUCTURE§!\n$im_athena_bow_DESC$"

 im_pylon_of_hearth: "§CTransmutation Pylon§!"
 im_pylon_of_hearth_DESC: "Upscaling the Transmutator, we achieve this megastructure. Capable of producing points with ease."
 im_pylon_of_hearth_MEGASTRUCTURE_DETAILS: "$im_pylon_of_hearth_DESC$"

 im_star_searer: "§CStar Searer§!"
 im_star_searer_DESC: "To ensure we can construct future star-bound megastructures, §Cwe must first sear them like they're over an open flame.§!"
 im_star_searer_MEGASTRUCTURE_DETAILS: "$im_star_searer_DESC$"
 im_dysonsphere: "§CStellar Cage§!"
 im_dysonsphere_DESC: "This dyson-sphere-esque megastructure utilizes a §CSearing Star's§! indomitable heat and enigmatic energies to fuel our growth. §CWith it, we can grow ever larger.§!"
 im_dysonsphere_MEGASTRUCTURE_DETAILS: "$im_dysonsphere_DESC$"

 im_aresforge_base: "§CForge of Ares§! - Base"
 im_aresforge_base_DESC: "Our planets are not enough. The factory must grow. §YWe must expand our infrastructure.§!\n§RWARNING - REMOVES SYSTEM PLANETS§!"
 im_aresforge_base_MEGASTRUCTURE_DETAILS: "§YSTRATEGIC MEGASTRUCTURE§!\n$im_aresforge_base_DESC$"
 im_aresforge_shieldplus: "§CFOA§! - Wings & Shield"
 im_aresforge_shieldplus_DESC: "If we want to defend our Forge, we must protect it with a shield. We must also establish the Wings, so that we can properly establish the next part of our Forge."
 im_aresforge_ring: "§CFOA§! - Ring & Assembly"
 im_aresforge_ring_DESC: "To begin harvesting of the Star, we must first assemble the mechanisms which will pull its' material for our harvest. Our harvesting beams can bypass the shield with no damage, thankfully."
 im_aresforge_complete: "§CForge of Ares§!"
 im_aresforge_complete_DESC: "§CAt last, The Forge is complete.§! We can now produce half of the required economy in one structure."

 im_forgehephaestos_base: "§CForge of Hephaestos§! - Base"
 im_forgehephaestos_base_DESC: "Since we need a better, more robust economy, we should look to mass-decompression of a black hole. Since they're nearly unending, this can go on forever.\n§RWARNING - REMOVES SYSTEM PLANETS§!"
 im_forgehephaestos_base_MEGASTRUCTURE_DETAILS: "§YSTRATEGIC MEGASTRUCTURE§!\n$im_forgehephaestos_base_DESC$"
 im_forgehephaestos_iris: "§CForge of Hephaestos§! - Daedalus Iris"
 im_forgehephaestos_iris_DESC: "The iris of the Hephaestos Forge must be put in place first. These help with pulling the materials out of the singularity."
 im_forgehephaestos_armature: "§CForge of Hephaestos§! - Armature"
 im_forgehephaestos_armature_DESC: "The gargantuan armature of the Hephaestos Forge can help support further expansion, especially for the necessary forges. Added shielding can help protect the sensitive iris and inner frame."
 im_forgehephaestos_half1: "§CForge of Hephaestos§! - Core Fields"
 im_forgehephaestos_half1_DESC: "The four Forge Cores must be assembled before the Hephaestos Forge itself can be completed. The top half of the cores, the Fields, are already large enough to be built first. And with the fields in place, they can already begin partial production."
 im_forgehephaestos_half2: "§CForge of Hephaestos§! - Core Rungs"
 im_forgehephaestos_half2_DESC: "The four Forge Cores are now nearly assembled. With the rungs in place, production is approaching half capacity. Up next is to finalize the Iris, the second shield, and another Armature."
 im_forgehephaestos_nearcomplete: "§CForge of Hephaestos§! - Daedalus Lens"
 im_forgehephaestos_nearcomplete_DESC: "With the Iris and Lenses finalized, all that's left is to fully activate the Forge."
 im_forgehephaestos_full: "§CForge of Hephaestos§!"
 im_forgehephaestos_full_DESC: "§CAnd now, the encore.§! We no longer have to worry about most of our economy, if we're keeping up with transmutation pylons and the §CForge of Ares.§!"

 im_daedalusbrain_base: "§CBrain of Daedalus§! - Base"
 im_daedalusbrain_base_DESC: "§YSTRATEGIC MEGASTRUCTURE§! -- §RREMOVES SYSTEM PLANETS§!\nThe §CBrain of Daedalus§! is a massive matrioshka brain, bordering on §Pcompletely insane§!. Theoretically, it will give us a good chunk of research across the board.\n§YUpgrades from the Stellar Cage.§!"
 im_daedalusbrain_base_MEGASTRUCTURE_DETAILS: "$im_daedalusbrain_base_DESC$"
 im_daedalusbrain_hull: "§CBrain of Daedalus§! - Hull"
 im_daedalusbrain_hull_DESC: "Partially operational already, with more additions, the §CBrain of Daedalus§! is somewhat complete. It already produces quite a sizeable amount of research."
 im_daedalusbrain_hull_MEGASTRUCTURE_DETAILS: "$im_daedalusbrain_hull_DESC$"
 im_daedalusbrain_complete: "§CBrain of Daedalus§!"
 im_daedalusbrain_complete_DESC: "Fully operational Matrioshka Brain, complete with multiple rings and a hull fit for multiple research divisions, producing untold secrets and technologies for our empire."
 im_daedalusbrain_complete_MEGASTRUCTURE_DETAILS: "$im_daedalusbrain_complete_DESC$"